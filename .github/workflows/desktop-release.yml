name: Desktop CI

on:
  push:
    branches: [main]
    tags: ["launcher-v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      self_signed:
        description: Build a test-only Windows installer with a self-signed certificate
        required: false
        type: boolean
        default: false
      repair_release_tag:
        description: Rebuild and attach assets to an existing release tag
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-javascript:
    name: Verify desktop JavaScript
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint, typecheck and test
        run: bunx turbo run lint typecheck test --concurrency=4

  verify-rust:
    name: Verify desktop Rust
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-directories: apps/desktop/src-tauri/resources
          cache-on-failure: true

      - name: Rust tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --features smoke

      - name: Clippy (warnings as errors)
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --features smoke -- -D warnings

  validate-sentry:
    name: Validate Sentry CI credentials
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/launcher-v')) || (github.event_name == 'workflow_dispatch' && inputs.repair_release_tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_RENDERER_PROJECT: ${{ vars.SENTRY_RENDERER_PROJECT }}
      SENTRY_NATIVE_PROJECT: ${{ vars.SENTRY_NATIVE_PROJECT }}
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Validate Sentry authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "::error::SENTRY_AUTH_TOKEN is not configured"
            exit 1
          fi
          if [ -z "${SENTRY_ORG:-}" ]; then
            echo "::error::SENTRY_ORG is not configured"
            exit 1
          fi
          for project in "$SENTRY_RENDERER_PROJECT" "$SENTRY_NATIVE_PROJECT"; do
            if [ -z "$project" ]; then
              echo "::error::A Sentry project variable is not configured"
              exit 1
            fi
            bunx "@sentry/cli@2.58.6" releases list --org "$SENTRY_ORG" --project "$project" >/dev/null
          done

  build-windows-installer:
    name: Build Windows installer (NSIS + MSI)
    needs: [validate-sentry]
    if: ${{ always() && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/launcher-v')) || (github.event_name == 'workflow_dispatch' && inputs.repair_release_tag != '') || (github.event_name == 'workflow_dispatch' && inputs.self_signed)) && (needs.validate-sentry.result == 'success' || needs.validate-sentry.result == 'skipped') }}
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VITE_API_URL: https://launcher-api-production-e506.up.railway.app
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      SENTRY_NATIVE_DSN: ${{ vars.SENTRY_NATIVE_DSN }}
      SENTRY_REQUIRED: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/launcher-v')) || (github.event_name == 'workflow_dispatch' && inputs.repair_release_tag != '')) && 'true' || 'false' }}
      RELEASE_MODE: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/launcher-v')) || (github.event_name == 'workflow_dispatch' && inputs.repair_release_tag != '')) && 'true' || 'false' }}
      RELEASE_TAG: ${{ (github.event_name == 'push' && github.ref_name) || inputs.repair_release_tag }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_RENDERER_PROJECT: ${{ vars.SENTRY_RENDERER_PROJECT }}
      SENTRY_NATIVE_PROJECT: ${{ vars.SENTRY_NATIVE_PROJECT }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.repair_release_tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync desktop version with the release version
        shell: pwsh
        run: |
          bun run sync:desktop-version
          $version = (Get-Content -Raw -Path "package.json" | ConvertFrom-Json).version
          "VITE_APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate signing and telemetry configuration
        shell: pwsh
        run: |
          $isRelease = $env:RELEASE_MODE -eq "true"
          if ($isRelease -and $env:RELEASE_TAG -notmatch '^launcher-v\d+\.\d+\.\d+$') {
            throw "RELEASE_TAG must match launcher-vX.Y.Z"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is required to build updater artifacts"
          }
          if ($isRelease) {
            foreach ($name in @(
              "VITE_SENTRY_DSN",
              "SENTRY_NATIVE_DSN",
              "SENTRY_AUTH_TOKEN",
              "SENTRY_ORG",
              "SENTRY_RENDERER_PROJECT",
              "SENTRY_NATIVE_PROJECT"
            )) {
              if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
                throw "$name is required for a production release"
              }
            }
          }

      - name: Verify production API
        shell: pwsh
        run: Invoke-WebRequest -Uri "$env:VITE_API_URL/api/health" -UseBasicParsing -TimeoutSec 30 | Out-Null

      - name: Create test-only Windows signing certificate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.self_signed }}
        shell: pwsh
        working-directory: apps/desktop
        run: |
          $signingDirectory = Join-Path $env:RUNNER_TEMP "launcher-dev-signing"
          New-Item -ItemType Directory -Path $signingDirectory -Force | Out-Null
          $certificate = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=Launcher Development (self-signed)" `
            -FriendlyName "Launcher Development (self-signed)" `
            -KeyAlgorithm RSA `
            -KeyLength 3072 `
            -HashAlgorithm SHA256 `
            -KeyExportPolicy Exportable `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -NotAfter (Get-Date).AddYears(5)
          $certificatePath = Join-Path $signingDirectory "launcher-dev.cer"
          Export-Certificate -Cert $certificate -FilePath $certificatePath | Out-Null
          Import-Certificate -FilePath $certificatePath -CertStoreLocation "Cert:\CurrentUser\TrustedPublisher" | Out-Null
          $overlayPath = "src-tauri/tauri.windows.conf.json"
          $overlay = Get-Content -Raw -Path $overlayPath | ConvertFrom-Json
          if ($null -eq $overlay.bundle) { $overlay | Add-Member -MemberType NoteProperty -Name bundle -Value ([pscustomobject]@{}) }
          if ($null -eq $overlay.bundle.windows) { $overlay.bundle | Add-Member -MemberType NoteProperty -Name windows -Value ([pscustomobject]@{}) }
          $overlay.bundle.windows | Add-Member -MemberType NoteProperty -Name certificateThumbprint -Value $certificate.Thumbprint -Force
          $overlay.bundle.windows | Add-Member -MemberType NoteProperty -Name digestAlgorithm -Value "sha256" -Force
          $overlay | ConvertTo-Json -Depth 10 | Set-Content -Path $overlayPath -Encoding utf8
          "LAUNCHER_DEV_CERTIFICATE_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LAUNCHER_DEV_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-directories: apps/desktop/src-tauri/resources
          cache-on-failure: true

      - name: Restore Crashpad handler from the dependency cache
        shell: pwsh
        working-directory: apps/desktop
        run: |
          $resourceDirectory = "src-tauri/resources"
          $resourcePath = Join-Path $resourceDirectory "crashpad_handler.exe"
          if (Test-Path -Path $resourcePath -PathType Leaf) { exit 0 }
          $buildDirectory = "src-tauri/target/release/build"
          $handler = Get-ChildItem -Path $buildDirectory -Filter "crashpad_handler.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -ne $handler) {
            New-Item -ItemType Directory -Path $resourceDirectory -Force | Out-Null
            Copy-Item -Path $handler.FullName -Destination $resourcePath -Force
            exit 0
          }
          cargo clean --manifest-path src-tauri/Cargo.toml --package sentry-contrib-native --package sentry-contrib-native-sys

      - name: Validate committed Tauri icons
        shell: pwsh
        working-directory: apps/desktop
        run: |
          foreach ($icon in @(
            "src-tauri/icons/32x32.png",
            "src-tauri/icons/128x128.png",
            "src-tauri/icons/128x128@2x.png",
            "src-tauri/icons/icon.icns",
            "src-tauri/icons/icon.ico"
          )) {
            if (-not (Test-Path -Path $icon -PathType Leaf)) { throw "Missing committed icon: $icon" }
          }

      - name: Build frontend and Windows installer
        shell: pwsh
        run: |
          bun run build
          $bundleFiles = @(Get-ChildItem -Path "apps/desktop/dist/assets/*.js" -File)
          if ($bundleFiles.Count -eq 0) { throw "No frontend JavaScript bundle was generated" }
          $bundleText = ($bundleFiles | ForEach-Object { Get-Content -Raw -Path $_.FullName }) -join "`n"
          if (-not $bundleText.Contains($env:VITE_API_URL)) { throw "The frontend bundle does not contain VITE_API_URL=$env:VITE_API_URL" }
          Push-Location apps/desktop
          bunx tauri build --config '{"build":{"beforeBuildCommand":""}}'
          Pop-Location

      - name: Validate updater artifacts and generate latest manifest
        shell: pwsh
        working-directory: apps/desktop
        run: |
          $nsisDirectory = "src-tauri/target/release/bundle/nsis"
          $nsisInstaller = Get-ChildItem -Path $nsisDirectory -Filter "*.exe" -File | Where-Object { $_.Name -notlike "*uninstall*" } | Select-Object -First 1
          if ($null -eq $nsisInstaller) { throw "No NSIS installer was generated" }
          $updateBundle = Get-ChildItem -Path $nsisDirectory -File | Where-Object { $_.Name -match "\.nsis\.zip$" } | Select-Object -First 1
          if ($null -eq $updateBundle) { $updateBundle = $nsisInstaller }
          $updateSignature = Get-Item -Path "$($updateBundle.FullName).sig" -ErrorAction SilentlyContinue
          if ($null -eq $updateSignature) { throw "No updater signature was generated for $($updateBundle.Name)" }
          if ($env:RELEASE_MODE -eq "true") {
            $version = (Get-Content -Raw -Path "../../package.json" | ConvertFrom-Json).version
            $manifest = [ordered]@{
              version = $version
              notes = ""
              pub_date = (Get-Date).ToUniversalTime().ToString("o")
              platforms = [ordered]@{
                "windows-x86_64" = [ordered]@{
                  url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$($updateBundle.Name)"
                  signature = (Get-Content -Raw -Path $updateSignature.FullName).Trim()
                }
              }
            }
            $manifestPath = "src-tauri/target/release/bundle/latest.json"
            $manifest | ConvertTo-Json -Depth 10 | Set-Content -Path $manifestPath -Encoding utf8
            $parsed = Get-Content -Raw -Path $manifestPath | ConvertFrom-Json
            if ($parsed.version -ne $version -or [string]::IsNullOrWhiteSpace($parsed.platforms.'windows-x86_64'.signature)) { throw "Generated latest.json failed validation" }
          }

      - name: Upload native symbols to Sentry
        if: env.RELEASE_MODE == 'true'
        shell: pwsh
        working-directory: apps/desktop
        run: |
          $pdbPaths = @(Get-ChildItem -Path "src-tauri/target/release" -Filter "*.pdb" -File -Recurse | ForEach-Object { $_.FullName })
          if ($pdbPaths.Count -eq 0) { throw "No native PDB symbols were generated for the production release" }
          & bunx "@sentry/cli@2.58.6" debug-files upload --org $env:SENTRY_ORG --project $env:SENTRY_NATIVE_PROJECT @pdbPaths
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify self-signed installer signatures
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.self_signed }}
        shell: pwsh
        working-directory: apps/desktop
        run: |
          $installers = @(
            Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe"
            Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi"
          )
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
            if ($null -eq $signature.SignerCertificate) { throw "Installer is not Authenticode-signed: $($installer.FullName)" }
            if ($signature.SignerCertificate.Thumbprint -ne $env:LAUNCHER_DEV_CERTIFICATE_THUMBPRINT) { throw "Installer was signed by an unexpected certificate: $($installer.FullName)" }
          }

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: launcher-windows-installer
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.zip
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/release/bundle/msi/*.sig
          if-no-files-found: error
          retention-days: 14

      - name: Upload self-signed certificate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.self_signed }}
        uses: actions/upload-artifact@v4
        with:
          name: launcher-windows-self-signed-certificate
          path: ${{ runner.temp }}/launcher-dev-signing/launcher-dev.cer
          if-no-files-found: error
          retention-days: 14

      - name: Create public GitHub Release
        if: env.RELEASE_MODE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --title $env:RELEASE_TAG --notes "Desktop release $env:RELEASE_TAG"
          }

      - name: Attach installers and updater manifest
        if: env.RELEASE_MODE == 'true'
        shell: pwsh
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assetPaths = @(
            Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File
            Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.zip" -File
            Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File
            Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.sig" -File
            Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.sig" -File
            Get-Item -Path "src-tauri/target/release/bundle/latest.json"
          ) | ForEach-Object { $_.FullName }
          if ($assetPaths.Count -lt 5) { throw "Expected installers, signatures, and latest.json before release upload" }
          gh release upload $env:RELEASE_TAG @assetPaths --repo $env:GITHUB_REPOSITORY --clobber

      - name: Validate public updater manifest
        if: env.RELEASE_MODE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $expectedVersion = (Get-Content -Raw -Path package.json | ConvertFrom-Json).version
          $manifestDirectory = Join-Path $env:RUNNER_TEMP "launcher-release-manifest"
          New-Item -ItemType Directory -Path $manifestDirectory -Force | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern "latest.json" --dir $manifestDirectory --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifestPath = Join-Path $manifestDirectory "latest.json"
          if (-not (Test-Path -Path $manifestPath -PathType Leaf)) { throw "GitHub release API did not return latest.json" }
          $manifest = Get-Content -Raw -Path $manifestPath | ConvertFrom-Json
          $platform = $manifest.platforms.'windows-x86_64'
          if ($null -eq $platform) { throw "Published latest.json is missing windows-x86_64" }
          if ([string]$manifest.version -ne [string]$expectedVersion) {
            throw "Published latest.json version mismatch: expected '$expectedVersion', got '$($manifest.version)'"
          }
          $expectedUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$($platform.url.Split('/')[-1])"
          if ([string]$platform.url -ne $expectedUrl) {
            throw "Published latest.json URL mismatch: expected '$expectedUrl', got '$($platform.url)'"
          }
          if ([string]::IsNullOrWhiteSpace([string]$platform.signature)) { throw "Published latest.json is missing the updater signature" }
          Write-Host "Validated published updater asset for $($manifest.version) with signature length $(([string]$platform.signature).Length)"

          $anonymousManifestUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/latest.json?cachebust=$([guid]::NewGuid().ToString('N'))"
          try {
            $anonymousResponse = Invoke-WebRequest -Uri $anonymousManifestUrl -UseBasicParsing -TimeoutSec 30
            $anonymousManifest = $anonymousResponse.Content | ConvertFrom-Json
            $anonymousPlatform = $anonymousManifest.platforms.'windows-x86_64'
            if ([string]$anonymousManifest.version -eq [string]$expectedVersion -and
              $null -ne $anonymousPlatform -and
              [string]$anonymousPlatform.url -eq [string]$platform.url -and
              [string]::IsNullOrWhiteSpace([string]$anonymousPlatform.signature) -eq $false) {
              Write-Host "Anonymous latest updater endpoint is serving $($anonymousManifest.version)"
            } else {
              Write-Warning "Anonymous latest updater endpoint is still propagating; the published release asset was validated via the GitHub API"
            }
          } catch {
            Write-Warning "Anonymous latest updater endpoint is still propagating: $($_.Exception.Message)"
          }
